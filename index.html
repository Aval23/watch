<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yatch</title>
<meta name="apple-mobile-web-app-title" content="Yatch">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --fg: #0f0f0f; --muted: #606060; --field: #f2f2f2; --line: #e5e5e5; --chip: #0000000d; --link: #065fd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f0f; --fg: #f1f1f1; --muted: #aaa; --field: #272727; --line: #3f3f3f; --chip: #ffffff1a; --link: #3ea6ff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.35 Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
         padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  svg { display: block; fill: currentColor; }

  /* Top bar */
  header { position: sticky; top: 0; z-index: 3; background: var(--bg); height: calc(48px + env(safe-area-inset-top));
           display: flex; align-items: center; padding: env(safe-area-inset-top) 4px 0 12px; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.8px; cursor: pointer; flex: none;
          display: flex; align-items: center; gap: 4px; }
  .logo img { width: 30px; height: 30px; border-radius: 7px; transform: scale(.8); }

  /* Thin red bar while anything loads */
  #bar { position: fixed; top: env(safe-area-inset-top); left: 0; height: 2px; width: 100%; background: #f00; z-index: 6;
         transform-origin: left; transform: scaleX(0); opacity: 0; transition: opacity .3s; }
  #bar.on { opacity: 1; animation: grow 2s ease-out forwards; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(.9); } }
  .spacer { flex: 1; }
  .icon { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .icon svg { width: 24px; height: 24px; }
  .icon:active { background: var(--chip); }
  header.searching { padding: env(safe-area-inset-top) 8px 0 4px; gap: 4px; }
  header.searching .logo, header.searching .spacer, header.searching #openSearch, header.searching .hback { display: none; }
  .hback { margin-left: -8px; margin-right: 4px; }
  #searchBar { display: none; flex: 1; min-width: 0; align-items: center; }
  header.searching #searchBar { display: flex; }
  #form { flex: 1; display: flex; min-width: 0; position: relative; }
  #q { flex: 1; min-width: 0; border: 0; border-radius: 20px; padding: 8px 36px 8px 16px; height: 36px;
       background: var(--field); color: var(--fg); font-size: 16px; outline: none; -webkit-appearance: none; }
  #q::-webkit-search-cancel-button { display: none; }
  #clear { position: absolute; right: 0; top: -2px; }
  #clear svg { width: 20px; height: 20px; }
  .mic { background: var(--field); margin-left: 8px; }
  .mic.live { background: #f00; color: #fff; }

  /* Home splash */
  .splash { display: flex; flex-direction: column; align-items: center; padding: 120px 16px 40px; gap: 28px; }
  .splash .brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .splash .mark { width: 88px; height: 88px; border-radius: 20px; display: block; }
  .splash .big { font-weight: 700; font-size: 40px; letter-spacing: -1px; }
  .pill { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; }
  .pill .icon { background: var(--field); width: 48px; height: 48px; }
  .pill .field { flex: 1; height: 48px; border-radius: 24px; background: var(--field); border: 0;
                 text-align: left; padding: 0 20px; color: var(--muted); font-size: 16px; cursor: text; }

  /* Results */
  main { max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 16px; }
  .card { cursor: pointer; padding-bottom: 20px; }
  .tw { position: relative; }
  .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--field); }
  .dur { position: absolute; right: 8px; bottom: 8px; background: #000c; color: #fff; font-size: 12px;
         font-weight: 500; padding: 1px 4px; border-radius: 4px; }
  @media (min-width: 640px) { .thumb { border-radius: 12px; } .grid { padding: 12px; } }
  .meta { display: flex; gap: 12px; padding: 12px 12px 0; }
  .av { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--field); object-fit: cover; }
  .txt { min-width: 0; flex: 1; }
  .title { font-weight: 500; font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2;
           -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .note { color: var(--muted); text-align: center; padding: 48px 16px; }
  .skel .thumb, .skel .av, .skel .line { background: var(--field); }
  .skel .line { height: 12px; border-radius: 6px; margin: 4px 0 8px; }
  .skel .line + .line { width: 60%; }
  .more { display: block; margin: 0 auto 32px; border: 1px solid var(--line); background: none;
          border-radius: 18px; padding: 8px 18px; font-size: 14px; cursor: pointer; }

  /* Watch */
  .player { aspect-ratio: 16 / 9; width: 100%; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 639px) { .watch { position: sticky; top: calc(48px + env(safe-area-inset-top)); z-index: 2; background: var(--bg); } }
  .wmeta { padding: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .wmeta .title { font-size: 18px; font-weight: 700; -webkit-line-clamp: 3; }
  .chan { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-weight: 500; font-size: 15px; }
  .wtop { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
  .wtop .sub { margin-top: 6px; }
  .wtop .sub b { color: var(--fg); font-weight: 500; margin-left: 6px; }
  .subbed { margin-left: auto; flex: none; background: var(--chip); border-radius: 18px; padding: 8px 14px;
            font-size: 14px; font-weight: 500; }
  .actions { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
  .actions::-webkit-scrollbar { display: none; }
  .act { flex: none; display: flex; align-items: center; gap: 6px; border: 0; background: var(--chip); border-radius: 18px;
         height: 36px; padding: 0 14px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .act svg { width: 20px; height: 20px; }

  /* Description drop-down */
  .desc { background: var(--chip); border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 14px; line-height: 1.45; }
  .stats { display: flex; justify-content: space-around; text-align: center; padding: 4px 0 12px;
           border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .stats b { display: block; font-size: 18px; }
  .stats span { color: var(--muted); font-size: 12px; }
  .dtext { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ts { color: var(--link); cursor: pointer; }
  .chapters { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
  .chapters h3 { font-size: 16px; margin: 4px 0; }
  .chap { display: flex; gap: 12px; width: 100%; border: 0; background: none; padding: 8px 0; text-align: left; cursor: pointer; }
  .chap .t { color: var(--link); flex: none; width: 56px; font-size: 13px; padding-top: 1px; }
  .less { display: block; border: 0; background: none; padding: 12px 0 0; font-weight: 500; cursor: pointer; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom));
           background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 5; }

  /* Recent searches */
  #recent { position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; bottom: 0; z-index: 4;
            background: var(--bg); overflow-y: auto; }
  .rec { display: flex; align-items: center; gap: 16px; padding: 0 4px 0 16px; height: 48px; cursor: pointer; }
  .rec > svg { width: 24px; height: 24px; flex: none; color: var(--muted); }
  .rec span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .rec .icon svg { width: 20px; height: 20px; color: var(--muted); }

  /* Channel */
  .banner { width: calc(100% - 24px); margin: 0 12px; aspect-ratio: 6.2 / 1; object-fit: cover; border-radius: 12px;
            display: block; background: var(--field); }
  .chead { display: flex; align-items: center; gap: 16px; padding: 16px 12px 8px; }
  .cav { width: 72px; height: 72px; border-radius: 50%; flex: none; background: var(--field); object-fit: cover; }
  .cname { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .chead .sub { margin-top: 4px; }
  .cdesc { display: block; width: calc(100% - 24px); border: 0; background: none; padding: 0; margin: 4px 12px;
           text-align: left; cursor: pointer; color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cdesc.short { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  .csub { padding: 8px 12px; }
  .csub .subbed { display: block; text-align: center; margin: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; position: sticky;
          top: calc(48px + env(safe-area-inset-top)); background: var(--bg); z-index: 2; }
  .tabs button { flex: 1; max-width: 140px; border: 0; background: none; height: 48px; font-size: 14px; font-weight: 500;
                 color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--fg); border-bottom-color: var(--fg); }
  .count { position: absolute; right: 0; top: 0; bottom: 0; width: 40%; background: #000a; color: #fff;
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
           font-size: 13px; font-weight: 500; }
  @media (min-width: 640px) { .count { border-radius: 0 12px 12px 0; } }
  .count svg { width: 24px; height: 24px; }
  .phead { padding: 12px 12px 4px; }
  .phead .title { font-size: 20px; font-weight: 700; -webkit-line-clamp: 3; }

  /* Subscriptions */
  .chans { display: flex; gap: 12px; overflow-x: auto; padding: 8px 12px 12px; border-bottom: 1px solid var(--line);
           margin-bottom: 12px; scrollbar-width: none; }
  .chans::-webkit-scrollbar { display: none; }
  .chan-btn { border: 0; background: none; width: 64px; flex: none; padding: 0; cursor: pointer;
              display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .chan-btn img { width: 56px; height: 56px; border-radius: 50%; background: var(--field); object-fit: cover;
                  border: 2px solid transparent; }
  .chan-btn span { width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .chan-btn.on img { border-color: var(--fg); }
  .chan-btn.on span { color: var(--fg); font-weight: 500; }

  /* You */
  .you { padding: 16px 0; }
  .me { display: flex; align-items: center; gap: 16px; padding: 8px 16px 20px; font-size: 24px; font-weight: 700; }
  .me .ring { width: 64px; height: 64px; border-radius: 50%; background: var(--field);
              display: flex; align-items: center; justify-content: center; }
  .me .ring svg { width: 36px; height: 36px; }
  .row-btn { display: flex; align-items: center; gap: 24px; width: 100%; border: 0; background: none;
             padding: 14px 16px; font-size: 15px; text-align: left; cursor: pointer; }
  .row-btn svg { width: 24px; height: 24px; }
  .you h2 { font-size: 20px; margin: 16px 12px 4px; }
  .hrow { display: flex; gap: 12px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; align-items: flex-start; }
  .hrow::-webkit-scrollbar { display: none; }
  .hrow .card { width: 168px; flex: none; padding-bottom: 0; }
  .hrow .thumb { border-radius: 8px; }
  .hrow .count { border-radius: 0 8px 8px 0; }
  .hrow .meta { padding: 8px 0 0; }
  .hrow .title { font-size: 14px; }
  .hrow .more { flex: none; align-self: center; margin: 0; }
  .add { max-width: 480px; margin: 0 auto; padding: 16px 12px 32px; }
  .add p { color: var(--muted); font-size: 13px; }
  .add input { width: 100%; margin: 8px 0; border: 0; border-radius: 20px; padding: 9px 16px;
               background: var(--field); color: var(--fg); font-size: 16px; outline: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 0; background: var(--field); border-radius: 18px; padding: 8px 16px; font-size: 14px; cursor: pointer; }

  /* Bottom bar */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--bg);
        border-top: 1px solid var(--line); display: flex; justify-content: space-around;
        padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; max-width: 160px; border: 0; background: none; height: 56px; cursor: pointer;
               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; }
  nav svg { width: 24px; height: 24px; }
  [hidden] { display: none !important; }
</style>
</head>

<div id="bar"></div>
<header id="header">
  <button class="icon hback" id="hback" aria-label="Back" hidden><svg><use href="#i-back"/></svg></button>
  <div class="logo" id="logo" aria-label="Home"><img src="icon-512.png" alt="">Yatch</div>
  <div class="spacer"></div>
  <button class="icon" id="openSearch" aria-label="Search"><svg><use href="#i-search"/></svg></button>
  <div id="searchBar">
    <button class="icon" id="closeSearch" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <form id="form" autocomplete="off">
      <input id="q" type="search" placeholder="Search" enterkeyhint="search">
      <button class="icon" id="clear" type="button" aria-label="Clear"><svg><use href="#i-x"/></svg></button>
    </form>
    <button class="icon mic" id="mic" aria-label="Search with your voice"><svg><use href="#i-mic"/></svg></button>
  </div>
</header>
<div id="recent" hidden></div>

<main>
  <section class="splash" id="splash">
    <div class="brand"><img class="mark" src="icon-512.png" alt=""><div class="big">Yatch</div></div>
    <div class="pill">
      <button class="field" id="splashField">Search</button>
      <button class="icon" id="splashMic" aria-label="Search with your voice"><svg><use href="#i-mic"/></svg></button>
    </div>
  </section>

  <section class="watch" id="watch" hidden>
    <div class="player" id="player"></div>
  </section>
  <div class="wmeta" id="wmeta" hidden>
    <button class="wtop" id="wtop">
      <div class="title" id="wtitle"></div>
      <div class="sub"><span id="wsub"></span><b id="wmore" hidden>...more</b></div>
    </button>
    <div class="desc" id="desc" hidden>
      <div class="stats" id="stats"></div>
      <div class="dtext" id="dtext"></div>
      <div class="chapters" id="chapters" hidden></div>
      <button class="less" id="less">Show less</button>
    </div>
    <div class="chan" id="wchanRow"><img class="av" id="wav" alt=""><span id="wchan"></span><span class="subbed" id="wsubbed" hidden>Subscribed</span></div>
    <div class="actions">
      <button class="act" id="shareBtn"><svg><use href="#i-share"/></svg>Share</button>
      <button class="act" id="saveBtn"><svg><use id="saveIcon" href="#i-save"/></svg><span id="saveLabel">Save</span></button>
    </div>
  </div>

  <section id="list" hidden>
    <div class="grid" id="grid"></div>
    <p class="note" id="note" hidden></p>
    <button class="more" id="more" hidden>Show more</button>
  </section>

  <section id="subs" hidden>
    <div class="chans" id="chans"></div>
    <div class="grid" id="sgrid"></div>
    <p class="note" id="snote" hidden></p>
  </section>

  <section id="channel" hidden>
    <img class="banner" id="cbanner" alt="" hidden>
    <div class="chead">
      <img class="cav" id="cav" alt="">
      <div><div class="cname" id="cname"></div><div class="sub" id="cstats"></div></div>
    </div>
    <button class="cdesc short" id="cdesc"></button>
    <div class="csub" id="csub" hidden><span class="subbed">Subscribed</span></div>
    <div class="tabs">
      <button id="tabVideos" class="on">Videos</button>
      <button id="tabLists">Playlists</button>
    </div>
    <div class="grid" id="cgrid"></div>
    <p class="note" id="cnote" hidden></p>
    <button class="more" id="cmore" hidden>Show more</button>
  </section>

  <section id="plist" hidden>
    <div class="phead"><div class="title" id="ptitle"></div><div class="sub" id="psub"></div></div>
    <div class="grid" id="pgrid"></div>
    <p class="note" id="pnote" hidden></p>
    <button class="more" id="pmore" hidden>Show more</button>
  </section>

  <section id="later" hidden>
    <div class="grid" id="lgrid"></div>
    <p class="note" id="lnote" hidden></p>
  </section>

  <section class="you" id="you" hidden>
    <div class="me"><div class="ring"><svg><use href="#i-you"/></svg></div><span>You</span></div>
    <button class="row-btn" id="openLater"><svg><use href="#i-later"/></svg>Watch later</button>
    <button class="row-btn" id="openAdd" hidden><svg><use href="#i-block"/></svg>Blocked words</button>
    <div id="mine" hidden>
      <h2>Playlists</h2>
      <div class="hrow" id="mgrid"><button class="more" id="mmore" hidden>More</button></div>
    </div>
  </section>

  <section class="add" id="add" hidden>
    <p>Type a word or phrase and tap Add. It is scrambled as soon as it is saved: nothing here can show it or take it back off.</p>
    <input id="word" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Word or phrase">
    <div class="row">
      <button class="chip" id="addBtn">Add</button>
      <button class="chip" id="lockBtn">Done, lock it</button>
      <button class="chip" id="closeAdd">Close</button>
    </div>
    <p id="addNote"></p>
  </section>
</main>

<nav>
  <button id="navHome"><svg><use id="homeIcon" href="#i-home"/></svg>Home</button>
  <button id="navSubs"><svg><use id="subsIcon" href="#i-subs-o"/></svg>Subscriptions</button>
  <button id="navYou"><svg><use href="#i-you"/></svg>You</button>
</nav>

<script>
  // The Apps Script web app does the searching. The key rides in the link's #k= part
  // and stays in the address bar, so a home-screen icon saved from the browser keeps it.
  var API_URL = 'https://script.google.com/macros/s/AKfycbyTizUsfvWZVEwJzpxszKyO-2kaz5ss06j5Qy1NEUGsrfIQLHero9IPY4X4GEfuAuml/exec';
  var KEY = (function () {
    var m = /[#&]k=([\w-]+)/.exec(location.hash);
    try {
      if (m) localStorage.setItem('k', m[1]);
      return m ? m[1] : localStorage.getItem('k') || '';
    } catch (e) {
      return m ? m[1] : '';
    }
  })();

  // Same shape as google.script.run: api().withSuccessHandler(f).withFailureHandler(g).fnName(args).
  function api() {
    var ok = function () {}, fail = function () {};
    var p = new Proxy({}, {
      get: function (_, name) {
        if (name === 'withSuccessHandler') return function (f) { ok = f; return p; };
        if (name === 'withFailureHandler') return function (f) { fail = f; return p; };
        return function () {
          var out = true;
          var done = function () { if (out) { out = false; loading(-1); } };
          loading(1);
          fetch(API_URL, { method: 'POST', body: JSON.stringify({ k: KEY, fn: name, args: [].slice.call(arguments) }) })
            .then(function (r) { return r.json(); })
            .then(function (d) { done(); if (d.error) throw new Error(d.error); ok(d.result); })
            .catch(function (e) { done(); fail(e); });
        };
      }
    });
    return p;
  }

  // The red bar runs while any call is out.
  var pending = 0;
  function loading(step) {
    pending = Math.max(0, pending + step);
    var bar = document.getElementById('bar');
    if (!pending) { bar.classList.remove('on'); return; }
    if (!bar.classList.contains('on')) { void bar.offsetWidth; bar.classList.add('on'); }
  }

  // Grey stand-in cards while a list loads.
  function skeleton(gridId, n) {
    for (var i = 0; i < n; i++) {
      var c = document.createElement('div');
      c.className = 'card skel';
      c.innerHTML = '<div class="tw"><div class="thumb"></div></div>' +
        '<div class="meta"><div class="av"></div><div class="txt"><div class="line"></div><div class="line"></div></div></div>';
      $(gridId).appendChild(c);
    }
  }
  function unskeleton(gridId) {
    [].slice.call($(gridId).querySelectorAll('.skel')).forEach(function (c) { c.remove(); });
  }

  var query = '';
  var next = null;
  var busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function decode(s) {
    var t = document.createElement('textarea');
    t.innerHTML = s;
    return t.value;
  }

  function ago(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    var units = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
    for (var i = 0; i < units.length; i++) {
      var n = Math.floor(s / units[i][1]);
      if (n >= 1) return n + ' ' + units[i][0] + (n > 1 ? 's' : '') + ' ago';
    }
    return 'just now';
  }

  function short(n) {
    var steps = [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (var i = 0; i < steps.length; i++) {
      if (n >= steps[i][0]) {
        var v = n / steps[i][0];
        return (v < 10 ? Math.floor(v * 10) / 10 : Math.floor(v)) + steps[i][1];
      }
    }
    return String(n);
  }

  function views(n) {
    if (!n) return '';
    return short(n) + (n === 1 ? ' view' : ' views');
  }

  function clock(s) {
    if (!s) return '';
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    var pad = function (x) { return (x < 10 ? '0' : '') + x; };
    return h ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  }

  // One view at a time: home, results, subs, later, watch (player above the list it came from), you, add.
  var current = 'home';
  var from = 'results';
  function show(view, opts) {
    opts = opts || {};
    current = view;
    if (LISTS[view]) from = view;
    if (view !== 'watch') { $('player').innerHTML = ''; playing = null; }
    $('splash').hidden = view !== 'home';
    Object.keys(LISTS).forEach(function (k) {
      $(LISTS[k]).hidden = !(view === k || (view === 'watch' && from === k));
    });
    recent(false);
    $('watch').hidden = $('wmeta').hidden = view !== 'watch';
    $('you').hidden = view !== 'you';
    $('add').hidden = view !== 'add';
    var onSubs = view === 'subs' || (view === 'watch' && from === 'subs');
    var onYou = view === 'you' || view === 'add' || view === 'later' || (view === 'watch' && from === 'later');
    $('homeIcon').setAttribute('href', !onSubs && !onYou ? '#i-home' : '#i-home-o');
    $('subsIcon').setAttribute('href', onSubs ? '#i-subs' : '#i-subs-o');
    searching(view === 'results' && !!query);
    if (!opts.pop) record(view, opts.v);
    $('hback').hidden = !(depth > 0 && /^(watch|later|add|channel|playlist)$/.test(view));
    window.scrollTo(0, 0);
  }

  // Back: every screen is a history step, so the back swipe and back button walk
  // through screens instead of leaving the page. Searches are kept so going back
  // to results costs no new search.
  var LISTS = { results: 'list', subs: 'subs', later: 'later', channel: 'channel', playlist: 'plist' };
  var depth = 0;
  var searches = {};
  function record(view, v) {
    var s = { view: view, query: query, from: from, v: v || null, ch: curChan, tab: curTab, pl: curPl };
    var was = history.state;
    var same = was && was.view === view && view !== 'watch' && was.query === query &&
      was.ch === curChan && (was.pl && was.pl.id) === (curPl && curPl.id);
    try {
      if (was) history.replaceState(Object.assign({}, was, { y: window.scrollY }), '');
      if (same) {
        history.replaceState(Object.assign(s, { depth: depth }), '');
      } else {
        depth++;
        history.pushState(Object.assign(s, { depth: depth }), '');
      }
    } catch (e) {}
  }

  window.onpopstate = function (e) {
    var s = e.state || { view: 'home', depth: 0 };
    depth = s.depth || 0;
    if (listening) listening.stop();
    $('q').blur();
    var list = s.view === 'watch' ? s.from : s.view;
    if (list === 'results' && s.query !== query) restoreSearch(s.query);
    if (list === 'channel' && s.ch && (s.ch !== curChan || s.tab !== curTab)) openChannel(s.ch, s.tab, { quiet: true });
    if (list === 'playlist' && s.pl && (!curPl || s.pl.id !== curPl.id)) openPlaylist(s.pl, { quiet: true });
    if (s.view === 'watch' && s.v) {
      from = s.from;
      play(s.v, { pop: true });
    } else {
      show(s.view === 'watch' ? 'home' : s.view, { pop: true });
    }
    window.scrollTo(0, s.y || 0);
  };

  function restoreSearch(q) {
    query = q || '';
    $('q').value = query;
    $('grid').innerHTML = '';
    note('');
    var hit = searches[query];
    if (!query) return;
    if (!hit) { run(true); return; }
    hit.items.forEach(function (v) { addCard(v, 'grid'); });
    next = hit.next;
    $('more').hidden = !next;
  }

  // On the home-screen copy there is no browser back swipe, so add one from the left edge.
  if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
    var sx = null, sy = 0;
    document.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      sx = t.clientX < 24 ? t.clientX : null;
      sy = t.clientY;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      var t = e.changedTouches[0];
      if (sx !== null && depth > 0 && t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) history.back();
      sx = null;
    }, { passive: true });
  }

  function searching(on) {
    $('header').classList.toggle('searching', on);
  }

  function openSearch() {
    searching(true);
    $('q').focus();
  }

  function goHome() {
    query = '';
    $('q').value = '';
    $('grid').innerHTML = '';
    $('more').hidden = true;
    note('');
    show('home');
  }

  function note(text) {
    $('note').textContent = text;
    $('note').hidden = !text;
  }

  function run(fresh) {
    if (busy || !query) return;
    busy = true;
    var q = query;
    if (fresh) { $('grid').innerHTML = ''; next = null; }
    $('more').hidden = true;
    note('');
    skeleton('grid', fresh ? 4 : 2);
    api()
      .withSuccessHandler(function (res) {
        busy = false;
        unskeleton('grid');
        if (fresh && res.items.length) remember(q);
        var hit = fresh || !searches[q] ? (searches[q] = { items: [] }) : searches[q];
        hit.items = hit.items.concat(res.items);
        hit.next = res.next;
        if (q !== query) return;
        res.items.forEach(function (v) { addCard(v, 'grid'); });
        next = res.next;
        $('more').hidden = !next;
        note($('grid').children.length ? '' : 'No results found.');
      })
      .withFailureHandler(function () {
        busy = false;
        unskeleton('grid');
        note('Something went wrong. Try again.');
      })
      .search(query, fresh ? null : next);
  }

  function addCard(v, gridId) {
    var card = document.createElement('div');
    card.className = 'card';
    var tw = document.createElement('div');
    tw.className = 'tw';
    var img = document.createElement('img');
    img.className = 'thumb';
    img.loading = 'lazy';
    img.src = v.thumb;
    tw.appendChild(img);
    if (v.seconds) {
      var dur = document.createElement('span');
      dur.className = 'dur';
      dur.textContent = clock(v.seconds);
      tw.appendChild(dur);
    }
    var meta = document.createElement('div');
    meta.className = 'meta';
    var av = document.createElement('img');
    av.className = 'av';
    av.alt = '';
    if (v.avatar) av.src = v.avatar;
    var txt = document.createElement('div');
    txt.className = 'txt';
    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = decode(v.title);
    var sub = document.createElement('div');
    sub.className = 'sub';
    var channel = decode(v.channel);
    sub.textContent = [channel, views(v.views), ago(v.published)].filter(Boolean).join(' · ');
    txt.appendChild(title);
    txt.appendChild(sub);
    meta.appendChild(av);
    meta.appendChild(txt);
    card.appendChild(tw);
    card.appendChild(meta);
    card.onclick = function () { play(v); };
    if (v.channelId) av.onclick = function (e) { e.stopPropagation(); openChannel(v.channelId); };
    $(gridId).appendChild(card);
  }

  // Subscriptions: channel row on top, newest uploads below; tap a channel to see only its videos.
  var chanList = null;
  var chanPick = null;
  function snote(text) {
    $('snote').textContent = text;
    $('snote').hidden = !text;
  }

  // Loaded in the background as soon as the page opens, so the tab is ready when tapped.
  var feeds = {};
  var subsStarted = false;
  function startSubs() {
    if (subsStarted) return;
    subsStarted = true;
    api()
      .withSuccessHandler(function (list) {
        chanList = list;
        drawChans();
        loadFeed();
      })
      .withFailureHandler(function () { subsStarted = false; snote('Something went wrong. Try again.'); })
      .subscriptionList();
  }

  function openSubs() {
    show('subs');
    if (!chanList) {
      $('sgrid').innerHTML = '';
      skeleton('sgrid', 4);
      startSubs();
    }
  }

  function drawChans() {
    $('chans').innerHTML = '';
    chanList.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chan-btn' + (c.id === chanPick ? ' on' : '');
      var img = document.createElement('img');
      img.alt = '';
      if (c.thumb) img.src = c.thumb;
      var name = document.createElement('span');
      name.textContent = c.title;
      b.appendChild(img);
      b.appendChild(name);
      b.onclick = function () {
        chanPick = chanPick === c.id ? null : c.id;
        drawChans();
        loadFeed();
      };
      $('chans').appendChild(b);
    });
  }

  function loadFeed() {
    $('sgrid').innerHTML = '';
    if (!chanList.length) { snote('No subscriptions yet.'); return; }
    var want = chanPick;
    if (feeds[want || '']) { drawFeed(feeds[want || '']); return; }
    snote('');
    skeleton('sgrid', 4);
    api()
      .withSuccessHandler(function (res) {
        feeds[want || ''] = res.items;
        if (want === chanPick) drawFeed(res.items);
      })
      .withFailureHandler(function () { unskeleton('sgrid'); snote('Something went wrong. Try again.'); })
      .subscriptionFeed(want);
  }

  function drawFeed(items) {
    $('sgrid').innerHTML = '';
    items.forEach(function (v) { addCard(v, 'sgrid'); });
    snote(items.length ? '' : 'No videos.');
  }

  // Talk to text: the browser's speech recognition, searching as soon as you stop talking.
  // Where there is none, the mic opens the keyboard and its own dictation key listens.
  var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  var listening = null;
  function keyboardMic() {
    $('q').placeholder = 'Tap the mic on your keyboard';
    $('q').focus();
  }
  function talk() {
    searching(true);
    $('q').value = '';
    if (!Speech) { keyboardMic(); return; }
    if (listening) { listening.stop(); return; }
    var r = new Speech();
    r.lang = navigator.language || 'en-US';
    r.interimResults = true;
    listening = r;
    $('mic').classList.add('live');
    $('q').placeholder = 'Listening…';
    r.onresult = function (e) {
      var text = '';
      for (var i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      $('q').value = text;
      if (e.results[e.results.length - 1].isFinal) r.stop();
    };
    r.onerror = function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') Speech = null; };
    r.onend = function () {
      listening = null;
      $('mic').classList.remove('live');
      $('q').placeholder = 'Search';
      if ($('q').value.trim()) $('form').requestSubmit();
    };
    try { r.start(); } catch (e) { r.onend(); keyboardMic(); }
  }
  $('q').onblur = function () { if (!listening) $('q').placeholder = 'Search'; };

  // Every card already passed the server's filters, so it plays without another round trip.
  var playing = null;
  function play(v, opts) {
    show('watch', { pop: opts && opts.pop, v: v });
    playing = v;
    var channel = decode(v.channel);
    $('wtitle').textContent = decode(v.title);
    $('wsub').textContent = [views(v.views), ago(v.published)].filter(Boolean).join('  ');
    $('wchan').textContent = channel;
    if (v.avatar) $('wav').src = v.avatar; else $('wav').removeAttribute('src');
    $('wsubbed').hidden = !(chanList && chanList.some(function (c) { return c.title === channel; }));
    $('wmore').hidden = $('desc').hidden = true;
    drawSave();
    $('player').innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + v.id +
      '?playsinline=1&rel=0&autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    api()
      .withSuccessHandler(function (d) {
        if (!d || playing !== v) return;
        if (d.subscribed) $('wsubbed').hidden = false;
        if (!v.channelId) v.channelId = d.channelId;
        drawDetails(d);
        $('wmore').hidden = false;
      })
      .details(v.id);
  }

  // Description drop-down: likes, views and date on top, then the text with its
  // timestamps tappable, then chapters when the description lists them.
  var TS = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})/g;
  function secs(m) { return (Number(m[1]) || 0) * 3600 + Number(m[2]) * 60 + Number(m[3]); }

  function drawDetails(d) {
    var when = new Date(d.published);
    var stats = [
      [d.likes === null ? '—' : short(d.likes), 'Likes'],
      [(d.views || 0).toLocaleString('en-US'), 'Views'],
      [when.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), String(when.getFullYear())]
    ];
    $('stats').innerHTML = '';
    stats.forEach(function (st) {
      var cell = document.createElement('div');
      var b = document.createElement('b');
      b.textContent = st[0];
      var span = document.createElement('span');
      span.textContent = st[1];
      cell.appendChild(b);
      cell.appendChild(span);
      $('stats').appendChild(cell);
    });

    var text = d.description || 'No description.';
    var box = $('dtext');
    box.innerHTML = '';
    var last = 0, m;
    TS.lastIndex = 0;
    while ((m = TS.exec(text))) {
      box.appendChild(document.createTextNode(text.slice(last, m.index)));
      box.appendChild(stamp(m[0], secs(m)));
      last = TS.lastIndex;
    }
    box.appendChild(document.createTextNode(text.slice(last)));

    // YouTube's own rule: chapters need at least three, starting at 0:00.
    var chaps = [];
    text.split('\n').forEach(function (line) {
      var c = /^\s*\(?((?:\d{1,2}:)?\d{1,2}:\d{2})\)?\s*[-–—:|]?\s*(.+)$/.exec(line);
      if (c) { TS.lastIndex = 0; chaps.push({ t: secs(TS.exec(c[1])), at: c[1], name: c[2] }); }
    });
    var ch = $('chapters');
    ch.innerHTML = '';
    ch.hidden = !(chaps.length >= 3 && chaps[0].t === 0);
    if (ch.hidden) return;
    var h = document.createElement('h3');
    h.textContent = 'Chapters';
    ch.appendChild(h);
    chaps.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chap';
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = c.at;
      var name = document.createElement('span');
      name.textContent = c.name;
      b.appendChild(t);
      b.appendChild(name);
      b.onclick = function () { seek(c.t); };
      ch.appendChild(b);
    });
  }

  function stamp(label, t) {
    var a = document.createElement('span');
    a.className = 'ts';
    a.textContent = label;
    a.onclick = function () { seek(t); };
    return a;
  }

  // The embed takes commands by message when it is loaded with enablejsapi=1.
  function seek(t) {
    var f = $('player').querySelector('iframe');
    if (!f) return;
    var send = function (func, args) {
      f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args }), '*');
    };
    send('seekTo', [t, true]);
    send('playVideo', []);
    window.scrollTo(0, 0);
  }

  function toggleDesc(open) {
    if ($('wmore').hidden) return;
    $('desc').hidden = !open;
    $('wmore').textContent = open ? '' : '...more';
  }

  // Watch later lives on this phone only.
  function getLater() {
    try { return JSON.parse(localStorage.getItem('later') || '[]'); } catch (e) { return []; }
  }
  function setLater(list) {
    try { localStorage.setItem('later', JSON.stringify(list.slice(0, 200))); } catch (e) {}
  }
  function isSaved(id) {
    return getLater().some(function (v) { return v.id === id; });
  }
  function drawSave() {
    var on = playing && isSaved(playing.id);
    $('saveIcon').setAttribute('href', on ? '#i-saved' : '#i-save');
    $('saveLabel').textContent = on ? 'Saved' : 'Save';
  }
  function drawLater() {
    $('lgrid').innerHTML = '';
    var list = getLater();
    list.forEach(function (v) { addCard(v, 'lgrid'); });
    $('lnote').textContent = list.length ? '' : 'Nothing saved yet. Tap Save under a video.';
    $('lnote').hidden = !!list.length;
  }

  // Channel page: header, then a Videos or Playlists tab. Pages are kept so going
  // back to a channel costs nothing.
  var curChan = null, curTab = 'videos', curPl = null;
  var chans = {};
  var lists = {};

  function openChannel(id, tab, opts) {
    opts = opts || {};
    var fresh = curChan !== id;
    curChan = id;
    curTab = tab || 'videos';
    if (!opts.quiet) show('channel', opts);
    var c = chans[id] || (chans[id] = { head: null, videos: { items: [], next: null, done: false },
                                        playlists: { items: [], next: null, done: false } });
    if (fresh) drawChannelHead(c.head);
    if (!c.head) {
      api().withSuccessHandler(function (h) {
        if (!h) { if (curChan === id) { $('cname').textContent = 'Not available'; } return; }
        c.head = h;
        if (curChan === id) drawChannelHead(h);
      }).channel(id);
    }
    drawTab();
  }

  function drawChannelHead(h) {
    $('cname').textContent = h ? decode(h.title) : '';
    $('cstats').textContent = h ? [h.handle, h.subscribers === null ? '' : short(h.subscribers) + ' subscribers',
      h.videos ? short(h.videos) + ' videos' : ''].filter(Boolean).join(' · ') : '';
    if (h && h.avatar) $('cav').src = h.avatar; else $('cav').removeAttribute('src');
    if (h && h.banner) { $('cbanner').src = h.banner; $('cbanner').hidden = false; } else $('cbanner').hidden = true;
    $('cdesc').textContent = h ? h.description : '';
    $('cdesc').hidden = !(h && h.description);
    $('cdesc').classList.add('short');
    $('csub').hidden = !(h && h.subscribed);
  }

  function drawTab() {
    $('tabVideos').classList.toggle('on', curTab === 'videos');
    $('tabLists').classList.toggle('on', curTab === 'playlists');
    var page = chans[curChan][curTab];
    $('cgrid').innerHTML = '';
    page.items.forEach(function (it) { curTab === 'videos' ? addCard(it, 'cgrid') : addList(it, 'cgrid'); });
    $('cmore').hidden = !page.next;
    $('cnote').hidden = true;
    if (!page.done) loadMore(page, curTab === 'videos' ? 'channelVideos' : 'channelPlaylists', curChan, 'cgrid', 'cnote', 'cmore',
      curTab === 'videos' ? addCard : addList, function () { return chans[curChan] && chans[curChan][curTab] === page; });
  }

  function openPlaylist(p, opts) {
    opts = opts || {};
    curPl = { id: p.id, title: p.title, count: p.count };
    if (!opts.quiet) show('playlist', opts);
    $('ptitle').textContent = decode(p.title);
    $('psub').textContent = p.count ? p.count + ' videos' : '';
    var page = lists[p.id] || (lists[p.id] = { items: [], next: null, done: false });
    $('pgrid').innerHTML = '';
    page.items.forEach(function (v) { addCard(v, 'pgrid'); });
    $('pmore').hidden = !page.next;
    $('pnote').hidden = true;
    if (!page.done) loadMore(page, 'playlist', p.id, 'pgrid', 'pnote', 'pmore', addCard,
      function () { return curPl && curPl.id === p.id; });
  }

  // One more page of a channel tab or playlist. "still" says whether the page on
  // screen is still the one asked for.
  function loadMore(page, fn, id, gridId, noteId, moreId, draw, still) {
    if (page.busy || (page.done && !page.next)) return;
    page.busy = true;
    $(moreId).hidden = true;
    skeleton(gridId, page.items.length ? 2 : 4);
    api()
      .withSuccessHandler(function (res) {
        page.busy = false;
        page.items = page.items.concat(res.items);
        page.next = res.next;
        page.done = true;
        if (!still()) return;
        unskeleton(gridId);
        res.items.forEach(function (it) { draw(it, gridId); });
        $(moreId).hidden = !res.next;
        $(noteId).textContent = page.items.length ? '' : 'Nothing here.';
        $(noteId).hidden = !!page.items.length;
      })
      .withFailureHandler(function () {
        page.busy = false;
        if (!still()) return;
        unskeleton(gridId);
        $(noteId).textContent = 'Something went wrong. Try again.';
        $(noteId).hidden = false;
      })[fn](id, page.next);
  }

  function addList(p, gridId) {
    var card = document.createElement('div');
    card.className = 'card';
    var tw = document.createElement('div');
    tw.className = 'tw';
    var img = document.createElement(p.thumb ? 'img' : 'div');
    img.className = 'thumb';
    if (p.thumb) { img.loading = 'lazy'; img.src = p.thumb; }
    var count = document.createElement('div');
    count.className = 'count';
    count.innerHTML = '<svg><use href="#i-list"/></svg>';
    count.appendChild(document.createTextNode(p.count));
    tw.appendChild(img);
    tw.appendChild(count);
    var meta = document.createElement('div');
    meta.className = 'meta';
    var txt = document.createElement('div');
    txt.className = 'txt';
    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = decode(p.title);
    var sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = 'View full playlist';
    txt.appendChild(title);
    txt.appendChild(sub);
    meta.appendChild(txt);
    card.appendChild(tw);
    card.appendChild(meta);
    card.onclick = function () { openPlaylist(p); };
    $(gridId).insertBefore(card, gridId === 'mgrid' ? $('mmore') : null);
  }

  // Your own playlists on the You tab, with Liked videos first. Loaded once.
  var mine = { items: [], next: null, done: false };
  function openYou() {
    show('you');
    if (mine.done) return;
    if (!$('mgrid').querySelector('.card')) addList({ id: 'liked', title: 'Liked videos', thumb: '', count: '' }, 'mgrid');
    $('mine').hidden = false;
    loadMine();
  }
  function loadMine() {
    if (mine.busy) return;
    mine.busy = true;
    $('mmore').hidden = true;
    skeleton('mgrid', 2);
    api()
      .withSuccessHandler(function (res) {
        mine.busy = false;
        mine.done = true;
        mine.next = res.next;
        unskeleton('mgrid');
        res.items.forEach(function (p) { addList(p, 'mgrid'); });
        $('mmore').hidden = !res.next;
      })
      .withFailureHandler(function () {
        mine.busy = false;
        $('mine').hidden = true;
      })
      .myPlaylists(mine.next);
  }

  // Recent searches: kept on this phone only, and only searches that found something.
  function getRecent() {
    try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch (e) { return []; }
  }
  function remember(q) {
    var list = getRecent().filter(function (x) { return x.toLowerCase() !== q.toLowerCase(); });
    list.unshift(q);
    try { localStorage.setItem('recent', JSON.stringify(list.slice(0, 20))); } catch (e) {}
  }
  function forget(q) {
    try { localStorage.setItem('recent', JSON.stringify(getRecent().filter(function (x) { return x !== q; }))); } catch (e) {}
  }
  function recent(on) {
    var box = $('recent');
    if (!on) { box.hidden = true; return; }
    var typed = $('q').value.trim().toLowerCase();
    var list = getRecent().filter(function (x) { return !typed || x.toLowerCase().indexOf(typed) !== -1; });
    box.innerHTML = '';
    list.forEach(function (x) {
      var row = document.createElement('div');
      row.className = 'rec';
      row.innerHTML = '<svg><use href="#i-history"/></svg><span></span>' +
        '<button class="icon" aria-label="Remove"><svg><use href="#i-x"/></svg></button>';
      row.querySelector('span').textContent = x;
      row.onclick = function () { $('q').value = x; $('form').requestSubmit(); };
      row.querySelector('button').onclick = function (e) { e.stopPropagation(); forget(x); recent(true); };
      box.appendChild(row);
    });
    box.hidden = !list.length;
  }

  var toastTimer = null;
  function toast(text) {
    var t = $('toast') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'toast', className: 'toast' }));
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2000);
  }

  $('form').onsubmit = function (e) {
    e.preventDefault();
    var q = $('q').value.trim();
    recent(false);
    if (!q) return;
    query = q;
    $('q').blur();
    show('results');
    run(true);
  };
  $('openSearch').onclick = openSearch;
  $('splashField').onclick = openSearch;
  $('clear').onclick = function () { $('q').value = ''; $('q').focus(); };
  $('closeSearch').onclick = function () {
    $('q').blur();
    recent(false);
    if (current === 'results') goHome();
    else { $('q').value = query; searching(false); }
  };
  $('logo').onclick = goHome;
  $('navHome').onclick = goHome;
  $('navYou').onclick = openYou;
  $('mmore').onclick = loadMine;
  $('navSubs').onclick = function () {
    if (current === 'subs' && chanList) { chanPick = null; drawChans(); loadFeed(); }
    else openSubs();
  };
  $('wtop').onclick = function () { toggleDesc($('desc').hidden); };
  $('wchanRow').onclick = function (e) {
    if (playing && playing.channelId && e.target !== $('wsubbed')) openChannel(playing.channelId);
  };
  $('cdesc').onclick = function () { $('cdesc').classList.toggle('short'); };
  $('tabVideos').onclick = function () { if (curTab !== 'videos') { curTab = 'videos'; drawTab(); record('channel'); } };
  $('tabLists').onclick = function () { if (curTab !== 'playlists') { curTab = 'playlists'; drawTab(); record('channel'); } };
  $('cmore').onclick = function () { drawTabMore(); };
  $('pmore').onclick = function () {
    var page = lists[curPl.id];
    var id = curPl.id;
    loadMore(page, 'playlist', id, 'pgrid', 'pnote', 'pmore', addCard, function () { return curPl && curPl.id === id; });
  };
  function drawTabMore() {
    var page = chans[curChan][curTab];
    var tab = curTab;
    loadMore(page, tab === 'videos' ? 'channelVideos' : 'channelPlaylists', curChan, 'cgrid', 'cnote', 'cmore',
      tab === 'videos' ? addCard : addList, function () { return chans[curChan] && chans[curChan][curTab] === page; });
  }
  $('q').addEventListener('focus', function () { recent(true); });
  $('q').addEventListener('input', function () { recent(true); });

  // Endless scroll: when a "Show more" button comes into view, it presses itself.
  if (window.IntersectionObserver) {
    var seen = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting && !e.target.hidden) e.target.click(); });
    }, { rootMargin: '600px 0px' });
    ['more', 'cmore', 'pmore', 'mmore'].forEach(function (id) { seen.observe($(id)); });
  }
  $('less').onclick = function () { toggleDesc(false); };
  $('hback').onclick = function () { history.back(); };
  $('shareBtn').onclick = function () {
    if (!playing) return;
    var url = 'https://youtu.be/' + playing.id;
    if (navigator.share) {
      navigator.share({ title: decode(playing.title), url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { toast('Link copied'); });
    }
  };
  $('saveBtn').onclick = function () {
    if (!playing) return;
    var on = isSaved(playing.id);
    var list = getLater().filter(function (v) { return v.id !== playing.id; });
    if (!on) list.unshift(playing);
    setLater(list);
    drawSave();
    toast(on ? 'Removed from Watch later' : 'Saved to Watch later');
    if (from === 'later') drawLater();
  };
  $('openLater').onclick = function () { drawLater(); show('later'); };
  $('mic').onclick = talk;
  $('splashMic').onclick = talk;
  $('more').onclick = function () { run(false); };

  function showAdd(on) {
    show(on ? 'add' : 'you');
    $('addNote').textContent = '';
    $('word').value = '';
  }

  var lockArmed = false;
  $('openAdd').onclick = function () { showAdd(true); };
  $('closeAdd').onclick = function () { showAdd(false); };
  $('addBtn').onclick = function () {
    var text = $('word').value;
    $('word').value = '';
    if (!text.trim()) return;
    api()
      .withSuccessHandler(function (res) {
        if (!res.ok) { $('addNote').textContent = 'Adding is closed.'; $('openAdd').hidden = true; return; }
        $('addNote').textContent = res.added ? 'Added.' : 'Already on the list.';
      })
      .addWords(text);
  };
  $('lockBtn').onclick = function () {
    if (!lockArmed) {
      lockArmed = true;
      $('lockBtn').textContent = 'Tap again: this is for good';
      return;
    }
    api().withSuccessHandler(function () {
      $('openAdd').hidden = true;
      showAdd(false);
    }).lockAdding();
  };
  // No key yet (a home-screen copy keeps its own storage): paste the link or key once.
  if (!KEY) {
    document.querySelector('nav').hidden = true;
    $('splash').innerHTML =
      '<form class="pill" id="keyForm" autocomplete="off">' +
      '<input class="field" id="keyIn" type="password" placeholder="Paste your link" autocapitalize="off" spellcheck="false">' +
      '<button class="icon" type="submit" aria-label="Go">&#8594;</button></form>' +
      '<p class="note" id="keyNote" hidden></p>';
    $('keyForm').onsubmit = function (e) {
      e.preventDefault();
      var raw = $('keyIn').value.trim();
      var m = /k=([\w-]+)/.exec(raw);
      KEY = m ? m[1] : raw;
      api()
        .withSuccessHandler(function () {
          try { localStorage.setItem('k', KEY); } catch (err) {}
          location.reload();
        })
        .withFailureHandler(function () {
          KEY = '';
          $('keyNote').textContent = 'That one didn’t work. Paste the whole link from the file.';
          $('keyNote').hidden = false;
        })
        .canAdd();
    };
  } else {
    try { history.replaceState({ view: 'home', query: '', depth: 0 }, ''); } catch (e) {}
    api().withSuccessHandler(function (open) { $('openAdd').hidden = !open; }).canAdd();
    startSubs();
  }
</script>
</body>
</html>
